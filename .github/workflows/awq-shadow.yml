name: AWQ shadow observation

"on":
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-gates:
    name: Require native repository quality first
    uses: ./.github/workflows/quality.yml # zizmor: ignore[self-repository]
    with:
      concurrency-scope: awq-shadow

  awq-shadow:
    name: Observe AWQ v0.32.0 core policy
    needs: native-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select reviewed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.15
      - name: Download exact AWQ release wheel
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --max-filesize 230238 \
            --output "$RUNNER_TEMP/agent_workflow_quality-0.32.0-py3-none-any.whl" \
            https://github.com/martin-beck/agent-workflow-quality/releases/download/v0.32.0/agent_workflow_quality-0.32.0-py3-none-any.whl
      - name: Run additive shadow policy
        id: awq
        continue-on-error: true
        env:
          AWQ_PYTHON: python3
          AWQ_WHEEL: ${{ runner.temp }}/agent_workflow_quality-0.32.0-py3-none-any.whl
          AWQ_OUTPUT: ${{ runner.temp }}/awq-output.jsonl
        shell: bash
        run: |
          set -uo pipefail
          {
            tools/awq --root . doctor --format json &&
              tools/awq --root . check --tier pr --format json
          } | tee "$AWQ_OUTPUT"
          exit "${PIPESTATUS[0]}"
      - name: Classify shadow result
        if: always()
        env:
          AWQ_OUTCOME: ${{ steps.awq.outcome }}
          AWQ_OUTPUT: ${{ runner.temp }}/awq-output.jsonl
        shell: bash
        run: |
          case "$AWQ_OUTCOME" in
            success) classification=pass ;;
            failure)
              if python3 - "$AWQ_OUTPUT" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          records = [json.loads(line) for line in path.read_text().splitlines() if line]
          raise SystemExit(0 if records and records[-1].get("status") == "fail" else 1)
          PY
              then
                classification=failure
              else
                classification=tool-error
              fi
              ;;
            skipped) classification=skip ;;
            cancelled) classification=unsupported ;;
            *) classification=tool-error ;;
          esac
          printf 'AWQ v0.32.0 shadow classification: %s\n' "$classification" | tee -a "$GITHUB_STEP_SUMMARY"
          test -z "$(git status --porcelain)"
