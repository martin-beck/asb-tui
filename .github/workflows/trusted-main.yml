name: Trusted main verification

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asb-tui-trusted-main
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact trusted main revision
    if: >-
      github.repository == 'martin-beck/asb-tui' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [asb-development-v1-x86_64-ubuntu2404]
    timeout-minutes: 20
    env:
      EXPECTED_EVENT: ${{ github.event_name }}
      EXPECTED_REF: ${{ github.ref }}
      EXPECTED_REPOSITORY: ${{ github.repository }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Reject every untrusted trigger before checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_REPOSITORY" = martin-beck/asb-tui
          test "$EXPECTED_REF" = refs/heads/main
          case "$EXPECTED_EVENT" in push | workflow_dispatch) ;; *) exit 1 ;; esac
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Bind checkout to event SHA and current public main
        shell: bash
        run: |
          set -euo pipefail
          checkout_sha=$(git rev-parse HEAD)
          remote_main=$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')
          tools/verify-trusted-trigger.sh \
            "$EXPECTED_EVENT" "$EXPECTED_REPOSITORY" "$EXPECTED_REF" \
            "$EXPECTED_SHA" "$checkout_sha" "$remote_main"
          test -z "$(git status --porcelain)"
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component clippy,llvm-tools-preview,rustfmt
      - name: Install pinned Rust quality tools
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-llvm-cov@0.9.0
      - name: Enforce formal UI inventory before Rust tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate-ui-state-model.py
          git diff --exit-code -- docs/ui-state-model.generated.json
          python3 tools/test-ui-state-model.py
          python3 tools/validate-ui-state-model.py
      - name: Run complete locked Rust and supply-chain gates
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/asb-tui-target
          # The dedicated runner account is intentionally nologin.  Terminal
          # fixtures launch panes through the account's configured shell, so
          # provide an explicit non-login shell for this isolated test gate.
          SHELL: /bin/bash
        shell: bash
        run: |
          set -euo pipefail
          # The live terminal fixtures create and authenticate their own
          # private tmux servers.  This runner is long-lived, so never let an
          # ambient multiplexer session or socket-root override contaminate
          # the fixture's exact-server checks.
          unset TMUX TMUX_TMPDIR
          cargo +1.93.0 fmt --all --check
          cargo +1.93.0 clippy --locked --all-targets -- -D warnings
          cargo +1.93.0 test --locked
          RUSTDOCFLAGS='-D warnings' cargo +1.93.0 doc --locked --no-deps
          cargo +1.93.0 build --locked --release
          cargo deny --locked check
          cargo audit --deny warnings
          tools/run-coverage-clean.sh
      - name: Capture terminal fixture environment on failure
        if: failure()
        shell: bash
        run: |
          set -u
          echo "uid=$(id -u) gid=$(id -g)"
          echo "tmux=$(/usr/bin/tmux -V 2>&1 || true)"
          echo "screen=$(/usr/bin/screen --version 2>&1 | head -1 || true)"
          stat -c '%n type=%F mode=%a uid=%u gid=%g' /dev/ptmx /dev/pts 2>&1 || true
          scratch=$(mktemp -d)
          socket="$scratch/socket"
          /usr/bin/tmux -f /dev/null -S "$socket" new-session -P -F '#{window_id}' -d -s asb-fixture-diagnostic -- sleep 2
          echo "tmux_create_rc=$? socket=$socket"
          stat -c '%n type=%F mode=%a uid=%u gid=%g' "$socket" 2>&1 || true
          /usr/bin/tmux -f /dev/null -S "$socket" list-sessions 2>&1 || true
          pgrep -a tmux 2>&1 || true
      - name: Run schema, shell, workflow, provenance, and privacy gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool protocol/v1/capabilities.schema.json >/dev/null
          python3 tools/validate-compatibility-schemas.py
          python3 tools/validate-release-channel.py
          python3 tools/validate-publication.py
          python3 tools/test-release-verifier.py
          tools/test-promoted-self-test.sh
          python3 -m json.tool provenance/dependencies.lock.json >/dev/null
          python3 -m json.tool provenance/sbom.spdx.json >/dev/null
          tools/run-shell-quality.sh
          tools/run-workflow-quality.sh
          tools/run-gitleaks.sh --log-opts="$EXPECTED_SHA"
          ! git grep -InE '([B]EGIN (RSA|OPENSSH|EC) PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|github[_]pat_)'
          ! git grep -InE '(development[-_ ]host(name)?|runner[-_ ]host(name)?)[=:][^[:space:]]+'
          git diff --exit-code
          test -z "$(git status --porcelain)"
