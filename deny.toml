[advisories]
yanked = "deny"

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = [
  { crate = "hashbrown@0.16.1", reason = "Kasuari 0.4.12 requires hashbrown 0.16 while Ratatui Core 0.1.2 requires 0.17; remove when immutable Kasuari and Ratatui releases converge" },
  { crate = "syn@3.0.5", reason = "Ratatui instability macros require syn 3 while Crossterm derive-more and the current application derives require syn 2; remove when immutable releases converge" },
]

[[bans.features]]
crate = "ratatui@0.30.2"
allow = ["crossterm", "crossterm_0_29", "std"]
exact = true

[[bans.features]]
crate = "ratatui-core@0.1.2"
allow = ["default", "std", "underline-color"]
exact = true

[[bans.features]]
crate = "ratatui-crossterm@0.1.2"
allow = ["crossterm_0_29", "default", "underline-color"]
exact = true

[[bans.features]]
crate = "ratatui-widgets@0.3.2"
allow = ["std"]
exact = true

[[bans.features]]
crate = "crossterm@0.29.0"
allow = ["bracketed-paste", "default", "derive-more", "events", "windows"]
exact = true

[[bans.features]]
crate = "hashbrown@0.16.1"
allow = ["allocator-api2", "default", "default-hasher", "equivalent", "inline-more", "raw-entry"]
exact = true

[[bans.features]]
crate = "hashbrown@0.17.1"
allow = ["allocator-api2", "default", "default-hasher", "equivalent", "inline-more", "raw-entry"]
exact = true

[[bans.features]]
crate = "foldhash@0.2.0"
allow = []
exact = true

[licenses]
confidence-threshold = 0.93
allow = ["Apache-2.0", "BSL-1.0", "MIT", "Unicode-3.0", "Unlicense"]
exceptions = [
  { allow = ["Zlib"], crate = "foldhash@0.2.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
